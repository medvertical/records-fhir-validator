
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.2', '24.21.0']
    steps:
      - uses: actions/checkout@v6
      - name: Install minimum consumer runtime
        if: matrix.node == '20.20.2'
        uses: actions/setup-node@v6
        with:
          node-version: '20.0.0'
          package-manager-cache: false
      - name: Record minimum consumer runtime
        if: matrix.node == '20.20.2'
        run: echo "RECORDS_PACKAGE_SMOKE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install declared npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')" --ignore-scripts
      - run: npm install
      - run: npm run oss:audit-validator:tests
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run oss:smoke-validator
